<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da memória</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Jogo da memória</h1>
        <p class="subtitulo">Encontre os pares iguais!</p>

        <section class="placar">
            <p>Movimentos: <span id="movimentos">0</span></p>
            <p>Pares encontrados: <span id="pares">0</span>/8</p>
        </section>

        <section id="tabuleiro" class="tabuleiro"></section>
        <button id="reiniciar">Recomeçar</button>
    </main>

</body>
</html>
